name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check version is unpublished
        id: version
        shell: bash
        run: |
          set -euo pipefail
          export VERSION=$(node -p 'require("./manifest.json").version')
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          COUNT=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$VERSION" --jq '[.[] | select(.ref == "refs/tags/" + env.VERSION)] | length')
          # Use the exact tag name; matching-refs also returns longer prefixes.
          test "$COUNT" = 0
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This version already has a release; use a new version.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Install Chrome for browser tests
        run: npx playwright install --with-deps chrome
      - run: npm test
      - run: npm run package
      - name: Freeze release assets and notes
        run: node scripts/prepare-release.mjs
      - name: Attest all five release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/release/*
      - name: Create release draft, verify downloads, then publish
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" --draft --notes-file dist/release-notes.md
          DOWNLOAD="$RUNNER_TEMP/release-download"
          mkdir -p "$DOWNLOAD"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$DOWNLOAD"
          for asset in dist/release/*; do
            downloaded="$DOWNLOAD/$(basename "$asset")"
            cmp "$asset" "$downloaded"
            gh attestation verify "$downloaded" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
